<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nowe Struktury</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  body::before { z-index: 1; background: radial-gradient(ellipse at 40% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.8) 100%); }
  #stage { position: fixed; inset: 0; transform-origin: var(--ox, 50%) var(--oy, 50%); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ===== menu na łuku ===== */
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
  #wires path { fill: none; stroke: #5fe03a; stroke-width: 1.6; filter: drop-shadow(0 0 3px #5f0); opacity: .85; }
  #menu { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .item { position: absolute; left: 0; top: 0; display: flex; align-items: center; pointer-events: auto; cursor: pointer; will-change: transform, opacity; }
  .knob { position: absolute; width: var(--k); height: var(--k); margin: calc(var(--k) / -2) 0 0 calc(var(--k) / -2); border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #021402 0 30%, #2c8f12 42%, #b9ff5a 52%, #3aa316 60%, rgba(40,160,20,.25) 72%, transparent 74%);
    box-shadow: 0 0 calc(var(--k) * .35) rgba(110,255,50,.45), inset 0 0 calc(var(--k) * .2) rgba(160,255,80,.6); animation: wob 4s ease-in-out infinite; }
  .knob::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 2px solid rgba(190,255,120,.55); border-left-color: transparent; border-bottom-color: transparent;
    animation: spin 6s linear infinite; }
  .knob::after { content: ""; position: absolute; inset: 36%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #8fff4a, #155a08 70%); opacity: .7; }
  .item.sel .knob { background: radial-gradient(circle at 50% 50%, #ffcf4a 0 18%, #b05a06 32%, #3aa316 46%, #c8ff5a 53%, #3aa316 61%, rgba(40,160,20,.3) 72%, transparent 74%);
    box-shadow: 0 0 calc(var(--k) * .6) rgba(190,255,60,.8), inset 0 0 calc(var(--k) * .25) rgba(255,220,80,.7); }
  @keyframes wob { 50% { transform: scale(1.06, .95) rotate(4deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .barx { position: absolute; height: var(--bh); padding: 0 calc(var(--bh) * .9) 0 calc(var(--bh) * .45); display: flex; align-items: center;
    font: 700 calc(var(--bh) * .52) var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: #c3ff7c; white-space: nowrap;
    text-shadow: 0 0 6px rgba(120,255,60,.7), 0 1px 1px #000;
    background: linear-gradient(180deg, #7dff4a, #2b9b14 50%, #66e83a);
    clip-path: polygon(0 0, calc(100% - var(--bh) * .5) 0, 100% calc(var(--bh) * .5), 100% 100%, calc(var(--bh) * .35) 100%, 0 calc(100% - var(--bh) * .35));
    isolation: isolate; transition: color .15s; }
  .barx::before { content: ""; position: absolute; inset: 2px; z-index: -1; transition: background .15s;
    background: linear-gradient(180deg, rgba(40,120,22,.92), rgba(10,54,6,.94) 55%, rgba(24,90,14,.92)), repeating-linear-gradient(0deg, rgba(150,255,90,.05) 0 1px, transparent 1px 3px);
    clip-path: inherit; }
  .item.sel .barx { color: #183805; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .item.sel .barx::before { background: linear-gradient(180deg, #f7ff8a, #d4f53a 45%, #a6dc1c); }
  .item.sel .barx { filter: drop-shadow(0 0 10px rgba(220,255,60,.55)); }
  .item.go .barx::before { animation: flash .12s 3 alternate; }
  @keyframes flash { to { background: #fff; } }

  /* przyciski A/B na dole */
  .padbtn { position: fixed; bottom: 18px; z-index: 4; display: flex; align-items: center; gap: 10px; font: 500 13px var(--font-ui); letter-spacing: .18em; color: var(--text);
    text-shadow: 0 0 6px var(--glow); cursor: pointer; background: none; border: 0; padding: 0; clip-path: none; }
  .padbtn i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 900 20px var(--font-ui); font-style: normal; color: #d9ff9a;
    background: radial-gradient(circle at 40% 35%, #4fbf26, #155f0a 60%, #052a02); box-shadow: 0 0 0 2px var(--line), 0 0 14px var(--glow), inset 0 3px 6px rgba(255,255,255,.3); }
  .padbtn:hover { background: none; color: var(--hi); }
  #hintA { right: 24px; }

  /* panel gracza w prawym górnym rogu */
  #user { position: fixed; top: 14px; right: 16px; z-index: 4; display: flex; gap: 8px; align-items: center; }
  #user .nick { font: 700 14px var(--font-ui); letter-spacing: .1em; color: var(--hi); text-shadow: 0 0 8px var(--glow); text-transform: uppercase; padding: 8px 14px;
    background: linear-gradient(90deg, rgba(10,40,6,.2), rgba(40,110,20,.7)); clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); border-right: 3px solid var(--line); }
  #user button { padding: 8px 14px; font-size: 11px; }

  /* logowanie */
  #login { position: fixed; z-index: 4; right: 6vw; top: 50%; transform: translateY(-50%); width: min(380px, calc(100vw - 32px)); }
  #login .card { margin: 0; }
  #login .clock { font: 700 clamp(34px, 5vw, 56px) var(--font-ui); color: var(--hi); text-shadow: 0 0 14px var(--glow); text-align: right; margin-bottom: 10px; }

  /* intro */
  #intro { position: fixed; inset: 0; z-index: 30; background: #000; display: grid; place-items: center; cursor: pointer; }
  #intro .blob { width: 22vmin; height: 22vmin; background: radial-gradient(circle at 45% 40%, #f4ff9a, #7cff2a 35%, #1f8f0a 70%, rgba(20,120,10,0) 72%);
    filter: blur(1px) drop-shadow(0 0 30px #5f0) drop-shadow(0 0 60px #3c0); border-radius: 50%; transform: scale(.05); opacity: 0;
    animation: blob 2.6s .5s cubic-bezier(.4,0,.2,1) forwards, morph 1.1s .5s ease-in-out infinite alternate; }
  @keyframes blob { 15% { opacity: 1; transform: scale(.15); } 60% { transform: scale(.55) rotate(30deg); } 85% { transform: scale(.9) rotate(80deg); opacity: 1; } 100% { transform: scale(6) rotate(140deg); opacity: 0; } }
  @keyframes morph { 0% { border-radius: 50% 42% 55% 45% / 45% 55% 42% 58%; } 100% { border-radius: 38% 62% 40% 60% / 62% 38% 60% 40%; } }
  #intro .flash { position: absolute; inset: 0; background: radial-gradient(circle, #f2ffd0, #8fff40 40%, #0a3a04 80%); opacity: 0; animation: fl 1.1s 2.75s ease-out forwards; }
  @keyframes fl { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  #intro .title { position: absolute; text-align: center; opacity: 0; animation: ttl 2.2s 3s ease-out forwards; }
  #intro .title b { display: block; font: 900 clamp(28px, 7vw, 76px) var(--font-ui); letter-spacing: .12em; color: #b8ff4a;
    text-shadow: 0 0 18px #6f0, 0 0 50px #3a0, 0 2px 0 #1a4a05; }
  #intro .title span { font: 500 clamp(11px, 1.6vw, 15px) var(--font-ui); letter-spacing: .5em; color: #7fb26a; }
  @keyframes ttl { 0% { opacity: 0; transform: scale(1.4); filter: blur(10px); } 25% { opacity: 1; transform: none; filter: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
  #intro.out { transition: opacity .6s; opacity: 0; pointer-events: none; }

  /* przejście do apki: wlot w kulkę */
  #stage.warp { transition: transform .75s cubic-bezier(.6,0,.9,.4), filter .75s, opacity .55s .25s; transform: scale(9); filter: blur(6px) brightness(1.8); opacity: 0; }
  #warp { position: fixed; inset: 0; z-index: 20; background: #000; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s .45s; }
  #warp.on { opacity: 1; pointer-events: auto; }
  #warp i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #6f3; box-shadow: 0 0 16px #5f0, inset 0 0 10px #5f0; animation: wob .5s infinite; }

  .enter .item { animation: itemIn .6s cubic-bezier(.2,.9,.3,1) backwards; }
  @keyframes itemIn { from { opacity: 0; translate: 40vw 0; } }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #intro { display: none; } .knob, .knob::before { animation: none; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-hidden="true"></canvas>
  <svg id="wires" aria-hidden="true"></svg>
  <nav id="menu" aria-label="Menu główne"></nav>
</div>

<div id="user" hidden><span class="nick" id="nickLabel"></span><button id="muteBtn" type="button"></button><button id="logout" type="button">Wyloguj</button></div>
<button class="padbtn" id="hintA" hidden type="button"><i>A</i>WYBIERZ</button>

<section id="login" hidden>
  <div class="clock" id="clock"></div>
  <form class="card" id="loginForm">
    <h2>Zaloguj się</h2>
    <input name="nick" placeholder="Nick" autocomplete="username" required>
    <input name="password" type="password" placeholder="Hasło" autocomplete="current-password" required>
    <div class="err"></div>
    <button type="submit">Zaloguj</button>
    <div class="meta">Konta zakłada administrator.</div>
  </form>
</section>

<div id="intro" hidden><div class="blob"></div><div class="flash"></div><div class="title"><b>NOWE STRUKTURY</b><span>POZIOM -2</span></div></div>
<div id="warp"><i></i></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="common.js"></script>
<script type="module" src="dash.js"></script>
</body>
</html>
